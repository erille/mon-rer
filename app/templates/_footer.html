<footer class="footer">
  <span class="footer-theme">
    {{ ui.template_label }}:
    {% if theme == 'standard' %}
      <strong class="footer-current-theme">{{ ui.theme_standard }}</strong>
    {% else %}
      <a
        href="{{ request.url.include_query_params(theme='standard') | string }}"
        data-theme-link="standard"
        class="is-active"
      >
        {{ ui.theme_standard }}
      </a>
    {% endif %}
  </span>
  <span class="footer-language">
    {{ ui.language_label }}:
    {% include "_language_switcher.html" %}
  </span>
  <span><a href="https://ketah.info" rel="noreferrer" target="_blank">ketah.info</a></span>
  <span>{{ ui.original_author }}: <a href="https://x0r.fr" rel="noreferrer" target="_blank">https://x0r.fr</a></span>
  <span>{{ ui.data_label }}: <a href="https://prim.iledefrance-mobilites.fr" rel="noreferrer" target="_blank">Ile-de-France Mobilites</a></span>
</footer>
