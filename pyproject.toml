[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rer-web"
version = "2.0.0"
description = "Modern self-hosted departures board for Ile-de-France Mobilites train data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "jinja2>=3.1,<4.0",
  "pydantic-settings>=2.10,<3.0",
  "python-dotenv>=1.1,<2.0",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]

[tool.setuptools]
packages = ["app", "app.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
